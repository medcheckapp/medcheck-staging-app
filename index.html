<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>服薬確認 | 本番導入準備版</title>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
/* ---------- Base ---------- */
:root {
  --page: #f5f6f3;
  --paper: #ffffff;
  --ink: #26332f;
  --muted: #64726c;
  --line: #d9e0db;
  --main: #286a5d;
  --main-dark: #1b5147;
  --main-soft: #eaf3ef;
  --danger: #a33d36;
  --danger-soft: #fff3f1;
  --warning-soft: #fcf7ed;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
  letter-spacing: .01em;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #8dbaa8; outline-offset: 2px; }
button:disabled { opacity: .46; cursor: not-allowed; }

/* ---------- Header / progress ---------- */
header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: auto;
  padding: 21px 24px 17px;
  max-width: 760px;
}
.brand { display: flex; flex-direction: column; line-height: 1.25; gap: 2px; }
.brand-label { color: var(--main); font-weight: 700; font-size: 11px; letter-spacing: .15em; }
.brand-name { font-size: 24px; font-weight: 750; letter-spacing: .035em; }
#who { font-size: 14px; font-weight: 600; color: var(--muted); text-align: right; }
.steps {
  display: flex;
  gap: 0;
  max-width: 712px;
  margin: 0 auto;
  padding: 0 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.steps::-webkit-scrollbar { display: none; }
.steps span {
  position: relative;
  flex: 1 0 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 13px 2px 12px;
  border-bottom: 3px solid transparent;
  color: #7b8881;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.steps span::before {
  content: attr(data-number);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  border: 1px solid #c9d2cc;
  border-radius: 50%;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: #748079;
}
.steps span.on { color: var(--main-dark); border-color: var(--main); }
.steps span.on::before { color: #fff; background: var(--main); border-color: var(--main); }
.steps span.done { color: #546c5e; }
.steps span.done::before { color: var(--main); border-color: var(--main); }
.steps span.history-step { flex: 0 0 auto; padding-left: 10px; padding-right: 10px; }
.steps span.history-step::before { display: none; }

/* ---------- Content ---------- */
main { margin: 0 auto; max-width: 712px; padding: 27px 22px 68px; }
h2 { font-size: clamp(24px, 5vw, 29px); font-weight: 750; line-height: 1.4; letter-spacing: -.035em; margin: 0 0 10px; }
h3 { font-size: 17px; margin: 0 0 13px; font-weight: 700; }
p { margin: 9px 0 14px; }
.lead { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 22px; }
.section-label { display: block; margin: 0 0 8px; color: var(--main); font-size: 12px; font-weight: 750; letter-spacing: .1em; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 15px;
}
.card > b:first-child { font-weight: 700; }
.card .hint:last-child { margin-bottom: 0; }
.hint { color: var(--muted); font-size: 14px; line-height: 1.65; }
.big { font-size: 27px; font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
.detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px 19px; }
.detail-item { display: inline-flex; align-items: baseline; gap: 8px; }
.detail-item small { font-size: 13px; color: var(--muted); }
.detail-item b { font-size: 17px; }

/* ---------- Buttons / form controls ---------- */
button, .btn {
  display: block;
  width: 100%;
  min-height: 54px;
  background: var(--paper);
  border: 1px solid #c9d4cd;
  border-radius: 9px;
  color: var(--ink);
  text-align: center;
  padding: 13px 19px;
  margin: 10px 0;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.45;
  transition: background .12s, border-color .12s;
}
button:not(:disabled):active { background: #edf2ee; }
button.pri, button.ok {
  background: var(--main);
  color: #fff;
  border-color: var(--main);
}
button.pri:not(:disabled):active, button.ok:not(:disabled):active { background: var(--main-dark); }
button.ng { color: var(--danger); border-color: #e4b7b2; background: #fff; }
button.ng:not(:disabled):active { background: var(--danger-soft); }
button.sel { border-color: var(--main); background: var(--main-soft); color: var(--main-dark); box-shadow: inset 0 0 0 1px var(--main); }
button.sel.pri { color: #fff; background: var(--main); }
button.staff-choice, button.rc {
  display: flex; align-items: center; justify-content: space-between;
  text-align: left; padding: 18px 20px; min-height: 72px; margin: 0 0 9px;
}
button.staff-choice::after, button.rc::after {
  content: ''; display: block; width: 8px; height: 8px;
  border-top: 2px solid #778b81; border-right: 2px solid #778b81;
  transform: rotate(45deg); flex-shrink: 0; margin-left: 14px;
}
/* 職員欄：タップすると直下に一覧を展開 */
.staff-field { margin: 0 0 22px; }
.staff-field-label { display: block; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 9px; }
button.staff-dropdown-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 64px; margin: 0; padding: 14px 17px;
  border: 1px solid #b8c7be; background: #fff; text-align: left;
  font-size: 17px; font-weight: 600; color: var(--muted);
}
button.staff-dropdown-toggle.has-value { color: var(--ink); }
button.staff-dropdown-toggle[aria-expanded="true"] {
  border-color: var(--main); border-radius: 9px 9px 0 0;
  box-shadow: inset 0 0 0 1px var(--main);
}
.staff-chevron {
  display: block; flex: 0 0 10px; width: 10px; height: 10px;
  border-right: 2px solid var(--main); border-bottom: 2px solid var(--main);
  transform: rotate(45deg); transition: transform .15s ease;
  margin-right: 4px; margin-top: -5px;
}
button.staff-dropdown-toggle[aria-expanded="true"] .staff-chevron { transform: rotate(225deg); margin-top: 5px; }
.staff-dropdown-list {
  display: grid; background: #fff; border: 1px solid var(--main); border-top: none;
  border-radius: 0 0 9px 9px;
  max-height: 300px;  /* 4〜5名が見える高さで固定 */
  overflow-y: auto;   /* 職員が多い場合は一覧の内側をスクロール */
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #8ba69b #edf2ef;
}
.staff-dropdown-list::-webkit-scrollbar { width: 9px; }
.staff-dropdown-list::-webkit-scrollbar-track { background: #edf2ef; }
.staff-dropdown-list::-webkit-scrollbar-thumb {
  background: #8ba69b;
  border-radius: 6px;
  border: 2px solid #edf2ef;
}
.staff-dropdown-list[hidden] { display: none; }
button.staff-option {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0; padding: 13px 18px; min-height: 58px; border: 0;
  border-bottom: 1px solid var(--line); border-radius: 0;
  text-align: left; background: #fff; font-size: 17px; font-weight: 600;
}
button.staff-option:last-child { border-bottom: none; }
button.staff-option.selected { background: var(--main-soft); color: var(--main-dark); }
button.staff-option small { color: var(--main); font-size: 12px; font-weight: 650; }
button.staff-option:not(:disabled):active { background: var(--main-soft); }
button.rc { justify-content: flex-start; gap: 14px; }
button.rc::after { margin-left: auto; }
.rc img { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
.rc .resident-name { font-size: 19px; font-weight: 750; display: block; }
.rc .resident-info { font-size: 13px; font-weight: 500; color: var(--muted); display: block; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0 10px; }
.grid button { margin: 0; min-height: 56px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
#back:not(.ng) { background: transparent; border: 0; color: var(--muted); text-align: left; font-size: 14px; padding: 10px 0; margin-top: 18px; min-height: 42px; width: auto; }
#hist, #n3 { margin-top: 17px; background: transparent; border-color: var(--line); font-size: 15px; }
#stop { background: transparent; border-color: var(--line); color: var(--muted); font-size: 15px; }
#rst { border: 1px solid #e7c4c1; background: #fff; color: var(--danger); font-size: 15px; }
input, select, textarea {
  display: block; width: 100%; min-height: 51px; background: #fff;
  border: 1px solid #bdcac2; border-radius: 8px; padding: 11px 13px;
  color: var(--ink); font-size: 16px;
}
input::placeholder, textarea::placeholder { color: #84928a; }
input + button, textarea + button { margin-top: 12px; }
select { cursor: pointer; }
textarea { resize: vertical; min-height: 100px; }
label.ack { display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; font-weight: 700; font-size: 15px; }
label.ack input { width: 21px; height: 21px; min-height: 0; flex-shrink: 0; accent-color: var(--main); }
.photo { width: 132px; height: 132px; border-radius: 9px; object-fit: cover; border: 1px solid var(--line); margin-bottom: 8px; }
.person-card { text-align: center; padding: 29px 20px; }
.person-card .person-room { display: inline-block; margin-top: 14px; padding: 4px 15px; border-radius: 5px; background: var(--page); color: var(--muted); font-weight: 700; font-size: 14px; }

/* ---------- QR / status ---------- */
.qrguide {
  background: var(--warning-soft);
  border: 1px solid #eee1c8;
  border-left: 3px solid #c9a367;
  border-radius: 7px;
  padding: 13px 16px;
  font-size: 14px;
  line-height: 1.7;
  margin: 14px 0 19px;
}
.qrguide b { color: #5f4c2c; }
#cam { padding: 5px 0 12px; }
#cam video, video { width: 100%; max-height: 56vh; display: block; object-fit: contain; background: #14211f; border-radius: 10px; }
#qrphoto { font-size: 14px; padding: 10px; min-height: 53px; }
.err { background: var(--danger-soft); border-left: 4px solid var(--danger); color: #832f2c; border-radius: 5px; padding: 12px 15px; margin: 14px 0; font-size: 15px; font-weight: 650; line-height: 1.7; overflow-wrap: anywhere; }
.res { text-align: left; padding: 23px 23px 24px; border: 1px solid var(--line); border-left: 5px solid var(--main); background: #fff; border-radius: 9px; margin: 0 0 18px; }
.res.ok { border-left-color: var(--main); }
.res.ng { border-left-color: var(--danger); background: var(--danger-soft); border-top-color: #f0d6d3; border-right-color: #f0d6d3; border-bottom-color: #f0d6d3; }
.res .result-label { font-size: 13px; font-weight: 750; color: var(--main); margin-bottom: 5px; }
.res.ng .result-label { color: var(--danger); }
.res .big { font-size: 27px; }
.res .result-note { font-size: 15px; color: var(--muted); margin-top: 2px; }
.res.ng .result-note { color: #89463e; }
.chk { padding: 0; margin: 0; list-style: none; }
.chk li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 2px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #e4e9e5; }
.chk li:first-child { padding-top: 3px; }
.chk li:last-child { border: 0; padding-bottom: 3px; }
.chk li::before { content: '確認'; background: var(--main-soft); color: var(--main-dark); padding: 2px 7px; font-size: 11px; font-weight: 750; border-radius: 4px; flex: 0 0 auto; }
.chk li.f::before { content: '注意'; color: var(--danger); background: #fbe6e3; }
.chk li.f { color: #8f3630; }
.warnbox { background: var(--danger-soft); color: #86332d; border: 1px solid #edccc7; border-left: 4px solid var(--danger); border-radius: 7px; padding: 15px 18px; font-weight: 700; font-size: 16px; margin-bottom: 15px; }
.status-choice.sel.ok { background: var(--main-soft); color: var(--main-dark); border-color: var(--main); }
.status-choice.sel.ng { background: var(--danger-soft); color: #8f3630; border-color: var(--danger); }
.ov { position: fixed; inset: 0; background: rgb(19 34 30 / 57%); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 20; }
.ov .card { width: 100%; max-width: 440px; margin: 0; box-shadow: 0 18px 60px rgb(0 0 0 / 13%); }

/* ---------- Status overview ---------- */
.status-toolbar { display: grid; gap: 17px; }
.status-date-label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.status-date-field { max-width: 235px; }
.status-tabs { display: flex; flex-wrap: wrap; gap: 7px; }
.status-tabs button {
  flex: 1 1 90px; min-height: 43px; margin: 0; padding: 9px 8px;
  font-size: 14px; font-weight: 700; border-radius: 7px;
}
.status-tabs button.active { background: var(--main); color: #fff; border-color: var(--main); }
.status-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.status-summary-item { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 15px 12px; min-width: 0; }
.status-summary-item .status-count { display: block; font-size: 30px; line-height: 1.3; font-weight: 750; font-variant-numeric: tabular-nums; }
.status-summary-item .status-count small { font-size: 12px; font-weight: 650; margin-left: 2px; }
.status-summary-item .status-heading { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 3px; }
.status-summary-item.completed .status-count { color: var(--main-dark); }
.status-summary-item.alert .status-count { color: var(--danger); }
.status-note { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 6px 0 19px; }
.status-group { padding: 0; overflow: hidden; }
.status-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: #f7f9f7; padding: 14px 19px; border-bottom: 1px solid var(--line); }
.status-group-head h3 { margin: 0; font-size: 17px; }
.status-group-head small { color: var(--muted); font-size: 12px; font-weight: 650; }
.status-entry { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
.status-entry:last-child { border-bottom: 0; }
.status-person { font-size: 16px; font-weight: 750; line-height: 1.4; }
.status-room { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 8px; }
.status-med { font-size: 14px; line-height: 1.5; margin-top: 6px; }
.status-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
.status-result { display: flex; align-items: flex-end; flex-direction: column; gap: 5px; flex: 0 0 auto; }
.status-pill { white-space: nowrap; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: 750; }
.status-pill.done { background: var(--main-soft); color: var(--main-dark); }
.status-pill.pending { background: #eff1f0; color: #56635c; }
.status-pill.attention { background: #fbe7e4; color: var(--danger); }
.status-record-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.status-empty { background: #fff; border: 1px dashed #bdcac2; border-radius: 10px; padding: 26px 20px; text-align: center; color: var(--muted); font-size: 15px; }
/* ---------- 訂正履歴 / 試作版のみ ---------- */
.demo-global { padding: 7px 16px; background: #fcf7ed; border-bottom: 1px solid #e6d7b7; color: #745c31; font-size: 12px; font-weight: 700; text-align: center; }

.demo-safety { background: #fcf7ed; border: 1px solid #dfcda6; border-left: 4px solid #ae8744; padding: 13px 16px; border-radius: 7px; margin: 12px 0 22px; font-size: 14px; line-height: 1.7; }
.history-action { width: auto; min-height: 36px; display: inline-block; padding: 7px 10px; margin: 3px 4px 3px 0; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.history-revised { color: var(--main-dark); font-size: 12px; font-weight: 750; }
.history-before { color: var(--muted); font-size: 12px; }
.audit-items { margin: 15px 0; max-height: 42vh; overflow-y: auto; padding: 0 5px 0 0; }
.audit-entry { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.audit-entry:last-child { border-bottom: 0; }
.audit-entry small { color: var(--muted); }
.correction-modal { max-height: 88vh; overflow-y: auto; }
.correction-modal label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 7px; }
.correction-modal .lead { margin-bottom: 10px; }
.correction-modal textarea { min-height: 105px; }
/* ---------- Log ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; margin-bottom: 17px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 570px; }
th { color: var(--muted); font-size: 12px; font-weight: 750; background: #f4f7f4; }
th, td { border-bottom: 1px solid var(--line); padding: 12px 13px; text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.bad { color: var(--danger); background: var(--danger-soft); }
tr.bad td { font-weight: 650; }
.history-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.history-tools label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 6px; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  .header-inner { padding: 18px 17px 14px; }
  .brand-name { font-size: 22px; }
  #who { font-size: 12px; }
  .steps { padding: 0 6px; }
  .steps span { flex-direction: column; gap: 3px; font-size: 11px; padding: 9px 0 8px; }
  .steps span::before { width: 19px; height: 19px; flex-basis: 19px; }
  main { padding: 24px 16px 55px; }
  .card { padding: 17px 16px; }
  button.staff-choice, button.rc { padding: 16px; }
  .big, .res .big { font-size: 23px; }
  .row { flex-direction: column; gap: 0; }
  .history-tools { grid-template-columns: 1fr; }
  .status-summary { gap: 7px; }
  .status-summary-item { padding: 13px 9px; }
  .status-summary-item .status-count { font-size: 27px; }
  .status-summary-item .status-heading { font-size: 11px; }
  .status-entry { padding: 15px 14px; }
  .status-group-head { padding: 13px 14px; }
  .status-person { font-size: 15px; }
  .status-med { font-size: 13px; }
  .status-pill { padding: 5px 8px; }

}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

/* Supabase移行版 */
.login-shell {max-width:500px; margin:20px auto}
.login-shell .err {white-space:pre-line; overflow-wrap:anywhere;}
.login-shell label {font-size:14px;font-weight:700;display:block;margin:12px 0 5px}
.login-shell input {margin-bottom:8px}
.info-panel {border:1px solid #d9e0db;background:#f7faf8;border-left:4px solid var(--main);border-radius:8px;padding:14px 16px;margin:13px 0;font-size:14px}
.safety-panel {border:1px solid #ebd2aa;background:#fffaf0;border-left:4px solid #c59a4a;border-radius:8px;padding:13px 15px;margin:15px 0;font-size:14px}
.toolbar {display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.toolbar button {width:auto;flex:1;min-width:108px;margin:0;padding:10px 8px;min-height:46px;font-size:14px}
.staff-roster {max-height:300px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--main) #e8ede8}
.staff-roster::-webkit-scrollbar {width:9px}
.staff-roster::-webkit-scrollbar-thumb {background:#80a69a;border-radius:9px}
.staff-roster > div {padding:12px 17px;border-bottom:1px solid var(--line)}
.staff-roster > div.current {color:var(--main-dark);background:var(--main-soft);font-weight:700}
.muted {color:var(--muted)}
.action-link {font-size:13px; min-height:38px; width:auto; padding:8px 12px; margin:4px 0}
.err {white-space:pre-line}
.small-link {display:inline-block; margin-top:8px;font-size:14px;color:var(--main)}
.spin {display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin {to{transform:rotate(360deg)}}
header .header-inner {align-items:center}
#logout {min-height:34px;width:auto;margin:0;padding:6px 10px;font-size:12px}
#who {max-width:170px;white-space:normal}
@media (max-width:480px) {.header-inner{gap:9px} #who{font-size:11px} #logout{padding:6px}}

/* 管理者向け・スマホ/PC共通の登録画面 */
.admin-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:13px 0 20px; }
.admin-tabs button { margin:0; padding:10px 3px; min-height:47px; font-size:14px; }
.admin-tabs button.active { color:#fff; background:var(--main); border-color:var(--main); }
.admin-form label { display:block; font-size:14px; font-weight:700; margin:13px 0 6px; }
.admin-form label:first-child { margin-top:0; }
.admin-form input, .admin-form select, .admin-form textarea { width:100%; }
.admin-form .mini { font-size:12px; color:var(--muted); margin:2px 0 11px; }
.admin-list { display:grid; gap:10px; margin:14px 0 23px; }
.admin-entry { background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:14px 15px; }
.admin-entry.off { background:#f7f8f7; opacity:.78; }
.admin-entry b { overflow-wrap:anywhere; }

.admin-entry button { width:auto; min-height:38px; padding:7px 13px; font-size:13px; margin:10px 0 0; }

.admin-notice { font-size:13px; color:var(--muted); }

/* QR印刷・一包化登録。色数を抑えてスマホでも操作しやすくする */
.qr-top-actions{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 20px}
.qr-top-actions button{flex:1 1 135px;margin:0;min-height:47px;font-size:14px}
.qr-top-actions button.active{background:var(--main);color:#fff;border-color:var(--main)}
.qr-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qr-options label{display:block;margin:0 0 4px;font-size:13px;font-weight:700}
.qr-options select,.qr-options input{width:100%;min-width:0}
.qr-check{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.qr-check input{width:23px;height:23px;flex:none;margin:4px 0 0;accent-color:var(--main)}
.qr-check span{flex:1}
.qr-check small{display:block;color:var(--muted);font-size:12px}
.qr-label-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qr-label{background:#fff;border:1px solid #9dac9e;padding:13px 12px;text-align:center;break-inside:avoid;page-break-inside:avoid;overflow-wrap:anywhere}
.qr-label svg{display:block;margin:8px auto;max-width:200px;width:95%;height:auto;background:#fff}

.qr-label-drugs div{margin:2px 0}

.qr-print-heading{font-size:18px;font-weight:700;margin:0 0 12px}
.qr-label-date{font-size:16px;font-weight:850;border:2px solid #285e4e;border-radius:4px;padding:5px 2px;margin:6px 0;color:#173b30}

/* ---------- QR管理画面：スマホの横はみ出し対策 ---------- */
/* グリッド内の子要素は既定の最小幅を持つため、狭い画面でも縮められるようにする。 */
#app, #qr-page, #qr-content, .qr-label-grid, .qr-options,
.qr-top-actions, .qr-period-presets, .qr-print-heading {

  max-width:100%;

  min-width:0;

.qr-label-date-caption { display:block; font-size:12px; line-height:1.5; }

@media (max-width:520px) {

/* ---------- 2026-11: QR使用期間のスマホ/タブレット表示修正 ----------
 * iOS Safari等のdate入力はブラウザ固有の最小幅を持つことがある。
 * 印刷条件は端末幅によらず一列にし、入力欄の横方向の衝突を防ぐ。
 * プレビューのQRラベルも画面では一列表示し、紙への印刷は別途3列。
 */
#qr-content, #qr-filters, #qr-filters .qr-options,
#qr-page, #qr-page .qr-label-grid, #qr-page .qr-label {
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
}
#qr-filters .qr-options {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:12px;
}
#qr-filters .qr-options > div {
  min-width:0;
  width:100%;
  max-width:100%;
}
#qr-filters .qr-options label {
  display:block;
  max-width:100%;
  overflow-wrap:anywhere;
  line-height:1.5;
  margin:0 0 6px;
}
#qr-filters .qr-options input,
#qr-filters .qr-options select,
#qr-filters .qr-options input[type="date"] {
  display:block;
  box-sizing:border-box;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:100%;
  width:100%;
  min-width:0;
  max-width:100%;
  font-size:16px;
  line-height:normal;
  padding:10px 12px;
  margin:0;
}
#qr-filters .qr-options input[type="date"] {
  overflow:hidden;
  text-overflow:clip;
}
#qr-page .qr-label-grid {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:center;
  gap:16px;
}
#qr-page .qr-label {
  width:100%;
  max-width:410px;
  min-width:0;
  overflow:hidden;
}
#qr-page .qr-label-date {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  overflow-wrap:anywhere;
  white-space:normal;
}
#qr-page .qr-label-date-range {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  width:100%;
  min-width:0;
  max-width:100%;

/* ---------- 2026-11 iPad Safari 日付入力の枠はみ出し再修正 ----------
 * iOS/iPadOS Safari の input[type=date] は日付コントロールの内側幅が
 * padding / border 分だけ広く算出される場合がある。
 * 表示上の枠は親要素で管理し、native picker は入力そのものに残す。
 */
#qr-filters .qr-options > .qr-date-field {
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
  width:100%;
}
#qr-filters .qr-native-date-wrap {
  display:block;
  position:relative;
  box-sizing:border-box;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  background:#fff;
  border:1px solid #bdcac2;
  border-radius:8px;
}
#qr-filters .qr-native-date-wrap:focus-within {
  outline:3px solid #8dbaa8;
  outline-offset:2px;
}
#qr-filters .qr-native-date-wrap > input[type="date"] {
  display:block;
  /* iPad Safari が box-sizing を無視しても padding(12px×2) を加えた幅が枠内になる */
  box-sizing:content-box;
  width:calc(100% - 24px);
  inline-size:calc(100% - 24px);
  min-width:0;
  min-inline-size:0;
  max-width:calc(100% - 24px);
  max-inline-size:calc(100% - 24px);
  min-height:49px;
  border:0;
  border-radius:0;
  padding:10px 12px;
  margin:0;
  background:transparent;
  color:var(--ink);
  font-size:16px;
  line-height:normal;
  text-align:center;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
#qr-filters .qr-native-date-wrap > input[type="date"]:focus-visible {
  outline:none;
}
/* QR使用期間以外の項目と揃える。タブレットでも1列のまま。 */
#qr-filters .qr-options {
  width:100%;
  max-width:100%;
  grid-template-columns:minmax(0,1fr);
}
@media (max-width:1100px) {
  #qr-content, #qr-filters, #qr-filters .qr-options,
  #qr-filters .qr-date-field, #qr-filters .qr-native-date-wrap {
    box-sizing:border-box;
    min-width:0;
    max-width:100%;
  }
}

			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

// 日付計算はUTCの暦日を使い、夏時間・端末のタイムゾーンに影響されないようにする。
function parseDateISO(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;
  const d=new Date(value+'T00:00:00Z');
  return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===value?d:null;
}
function moveDay(value,delta){
  const d=parseDateISO(value);if(!d)return '';
  d.setUTCDate(d.getUTCDate()+delta);return d.toISOString().slice(0,10);
}
function periodDates(start,end){
  const a=parseDateISO(start),b=parseDateISO(end);
  if(!a||!b)return {dates:[],error:'開始日と終了日を正しく入力してください。'};
  const days=Math.round((b.getTime()-a.getTime())/86400000)+1;
  if(days<1)return {dates:[],error:'終了日は開始日以降に設定してください。'};
  if(days>366)return {dates:[],error:'期間は最長366日までにしてください。'};
  return {dates:Array.from({length:days},(_,i)=>moveDay(start,i)),error:''};
}

async function paginate(table,fields,decorate){
  let all=[];const PAGE=400;
  for(let from=0;from<10000;from+=PAGE){
    let query=decorate(client.from(table).select(fields)).range(from,from+PAGE-1);
    let {data,error}=await query;
    if(error)throw error;
    all.push(...(data||[]));
    if((data||[]).length<PAGE)return all;
  }
  throw new Error('データが多すぎるため表示を中断しました。ページ分割が必要です。');
}

function isGroupedPrescription(id){return C.qrGroupItems.some(i=>i.prescriptionId===id&&C.qrGroups.some(g=>g.id===i.groupId&&g.isActive))}
function safePackage(g,date){
  const r=repo.getResident(g.residentId),rxs=groupRxs(g);
  return !!g.isActive&&!!r?.is_active&&g.startDate<=date&&date<=g.endDate&&rxs.length>=2&&
    rxs.every(rx=>rx&&rx.isActive&&rx.residentId===g.residentId&&rx.timeSlot===g.timeSlot&&
      rx.startDate===g.startDate&&rx.endDate===g.endDate&&rx.startDate<=date&&date<=rx.endDate&&
      !!repo.getMedicine(rx.medicineId)?.is_active);
}
async function loadLogs(date){
  const logs=await paginate('medication_logs','id,prescription_id,staff_id,date,time_slot,status,reason,created_at',q=>q.eq('date',date).order('created_at',{ascending:false}));
  const ids=logs.map(l=>l.id),corr=[];
  for(let i=0;i<ids.length;i+=40){
    const chunk=ids.slice(i,i+40);
    const result=await paginate('medication_log_corrections','id,revision,medication_log_id,previous_status,new_status,correction_reason,corrected_by_staff_id,corrected_at',q=>q.in('medication_log_id',chunk).order('revision'));
    corr.push(...result);
  }
  C.logs=logs.map(l=>{let rx=repo.getPrescription(l.prescription_id);return {id:l.id,prescriptionId:l.prescription_id,staffId:l.staff_id,date:l.date,timeSlot:l.time_slot,status:l.status,reason:l.reason,createdAt:l.created_at,residentId:rx?.residentId,medicineId:rx?.medicineId}});
  C.corrections=corr.map(c=>({id:c.id,revision:c.revision,logId:c.medication_log_id,fromStatus:c.previous_status,toStatus:c.new_status,reason:c.correction_reason,staffId:c.corrected_by_staff_id,createdAt:c.corrected_at}));
  C.date=date;
}

// アプリ内QR発行（外部QR APIなし）。QRにはP/G番号＋有効開始日・終了日を格納。
function qrSvg(code){
  const qr=new QR_LOCAL.QRCode(0,QR_LOCAL.level.H);qr.addData(code);qr.make();
  const size=qr.getModuleCount(),quiet=4,full=size+quiet*2,paths=[];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(qr.isDark(y,x))paths.push(`M${x+quiet} ${y+quiet}h1v1h-1z`);
  return `<svg viewBox="0 0 ${full} ${full}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(code)}のQR"><rect width="100%" height="100%" fill="#fff"/><path d="${paths.join('')}" fill="#000"/></svg>`;
}
function qrPNG(code){
  const q=new QR_LOCAL.QRCode(0,QR_LOCAL.level.H);q.addData(code);q.make();
  const n=q.getModuleCount(),quiet=4,px=15,total=n+quiet*2;
  const cv=document.createElement('canvas');cv.width=total*px;cv.height=total*px+94;
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+quiet)*px,(y+quiet)*px,px,px);
  const period=/^MC2\|(\d{4}-\d{2}-\d{2})\|(\d{4}-\d{2}-\d{2})\|([PG][0-9]{3,8})$/.exec(code);
  ctx.textAlign='center';ctx.fillStyle='#111';
  ctx.font='bold 30px sans-serif';ctx.fillText(period?period[3]:code,cv.width/2,total*px+38);
  if(period){ctx.font='19px sans-serif';ctx.fillText(period[1]+' ～ '+period[2],cv.width/2,total*px+74);}
  return cv;
}
function downloadQrPNG(code){
  const canvas=qrPNG(code);
  canvas.toBlob(blob=>{
    if(!blob){notify('PNG画像を作成できませんでした');return}
    const p=/^MC2\|(\d{4}-\d{2}-\d{2})\|(\d{4}-\d{2}-\d{2})\|([PG][0-9]{3,8})$/.exec(code);
    const name=p?`${p[3]}_${p[1]}_${p[2]}`:code.replace(/[^0-9A-Za-z_-]/g,'_');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`服薬QR_${name}.png`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
  },'image/png');
}

    if(status===404)throw new Error('職員管理用の関数 medcheck-staff-admin が見つかりません（HTTP 404）。SupabaseのEdge Functions一覧に、この名前があるか確認してください。');
    if(status===401)throw new Error('職員管理用の関数に認証できません（HTTP 401）。再ログインとEdge FunctionのJWT検証設定を確認してください。');
    throw new Error(detail||'職員管理のサーバー機能を呼び出せません。Edge Functionの設定を確認してください。'+(status?'（HTTP '+status+'）':''));
  }
  if(!data?.ok)throw new Error(data?.error||'職員管理操作を確認できませんでした。');
  return data;
}

function listQrEntries(residentId,slot,date){
  if(!C.qrReady)return {items:[],warnings:['QR連携SQLが未設定です']};
  const warnings=[],items=[];
  for(const g of C.qrGroups.filter(g=>g.residentId===residentId&&g.timeSlot===slot&&g.isActive&&g.startDate<=date&&date<=g.endDate)){
    if(!safePackage(g,date)){warnings.push(g.id+'：構成処方に不整合があります。印刷できません');continue}
    items.push({id:g.id,type:'group',group:g,residentId:g.residentId,slot:g.timeSlot,rxs:groupRxs(g)});
  }
  for(const rx of C.prescriptions.filter(p=>p.residentId===residentId&&p.timeSlot===slot&&p.isActive&&p.startDate<=date&&date<=p.endDate)){
    if(isGroupedPrescription(rx.id))continue;
    if(!repo.getMedicine(rx.medicineId)?.is_active||!repo.getResident(rx.residentId)?.is_active){warnings.push(rx.id+'：登録情報が無効です');continue}
    items.push({id:rx.id,type:'single',residentId:rx.residentId,slot:rx.timeSlot,rxs:[rx]});
  }
  return {items:items.sort((a,b)=>a.id.localeCompare(b.id,'ja')),warnings};
}
// 指定期間内の各日について処方・包装の有効性を検査する。
// 薬がない日を自動補完せず、その日有効な処方だけを発行する。
// 指定期間内の有効な処方・一包化を重複なく集約する。
// 同じIDは1つのQRにまとめ、実際に有効な最初と最後の日だけを許可する。
function listQrPeriod(residentId,slot,start,end){
  const period=periodDates(start,end);
  if(period.error)return {items:[],warnings:[],days:[],error:period.error};
  const found=new Map(),warnings=new Set();
  for(const date of period.dates){
    const daily=listQrEntries(residentId,slot,date);
    for(const entry of daily.items){
      const key=entry.type+':'+entry.id;
      const existing=found.get(key);
      if(existing){existing.validEnd=date;}
      else found.set(key,{...entry,validStart:date,validEnd:date});
    }
    for(const message of daily.warnings)warnings.add(`${date}：${message}`);
  }
  const items=[...found.values()].map(entry=>({...entry,
    qrValue:periodQrValue(entry.id,entry.validStart,entry.validEnd)
  })).sort((a,b)=>a.id.localeCompare(b.id,'ja'));
  if(items.length>180)return {items:[],warnings:[...warnings],days:period.dates,error:'QRが180種類を超えます。利用者や時間帯を分けて印刷してください。'};
  return {items,warnings:[...warnings],days:period.dates,error:''};
}

  if(!Q.endDate)Q.endDate=Q.startDate;

  const groupCount=result.items.filter(x=>x.type==='group').length;

let qrDecoderLoading=null, detector=null;
let cameraStarting=false, lastQrFrame=0;
function getBarcodeDetector(){
  if(detector)return detector;
  if(!('BarcodeDetector' in window))return null;
  try{detector=new BarcodeDetector({formats:['qr_code']});return detector}catch(e){return null}
}
function qrAvailable(){return typeof window.jsQR==='function'||!!getBarcodeDetector()}
function loadQrScript(url){
  return new Promise((resolve)=>{
    const script=document.createElement('script');let finished=false;
    const complete=(ok)=>{if(finished)return;finished=true;clearTimeout(timer);if(!ok)script.remove();resolve(ok)};
    const timer=setTimeout(()=>complete(false),6500);
    script.src=url;script.async=true;script.onload=()=>complete(typeof window.jsQR==='function');script.onerror=()=>complete(false);
    document.head.appendChild(script);
  });
}
async function ensureQRDecoder(){
  if(typeof window.jsQR==='function')return true;
  if(!qrDecoderLoading){
    qrDecoderLoading=(async()=>{
      const sources=[
        'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
        'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'
      ];
      for(const url of sources){
        if(await loadQrScript(url)&&qrAvailable())return true;
      }
      return qrAvailable();
    })().finally(()=>{qrDecoderLoading=null});
  }
  // 標準のBarcodeDetectorがある場合は、追加ライブラリの取得を待たずに利用できる。
  // ただし追加ライブラリの読み込みも進め、標準解析失敗時に切り替え可能にする。
  if(getBarcodeDetector())return true;
  return qrDecoderLoading;
}

async function decodeQR(source,canvas,isStill=false){
  const native=getBarcodeDetector();
  if(native){
    try{const result=await native.detect(source);if(result.length&&result[0].rawValue)return result[0].rawValue}
    catch(e){console.warn('標準QR解析から画像解析へ切り替えます',e?.name||e)}
  }
  if(typeof window.jsQR!=='function')return null;
  const w=source.videoWidth||source.naturalWidth||source.width;
  const h=source.videoHeight||source.naturalHeight||source.height;
  if(!w||!h)throw new Error('画像のサイズを読み取れませんでした');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx)throw new Error('画像解析に使用する描画機能が利用できません');
  const max=Math.max(w,h);
  // 静止画は複数の解像度・中央領域で試し、小さなQRにも対応する。
  const cases=isStill?[
    [0,0,w,h,Math.min(max,1600)],
    [0,0,w,h,Math.min(max,2300)],
    [w*.15,h*.15,w*.70,h*.70,Math.min(max,2000)]
  ]:[[0,0,w,h,Math.min(max,1100)]];
  for(const [x,y,cw,ch,limit] of cases){
    const ratio=Math.min(1,limit/Math.max(cw,ch));
    const dw=Math.max(1,Math.round(cw*ratio)),dh=Math.max(1,Math.round(ch*ratio));
    canvas.width=dw;canvas.height=dh;
    ctx.drawImage(source,x,y,cw,ch,0,0,dw,dh);
    const pixels=ctx.getImageData(0,0,dw,dh);
    const q=window.jsQR(pixels.data,dw,dh,{inversionAttempts:'attemptBoth'});
    if(q?.data)return q.data;
  }
  return null;
}

    return '使用できるカメラが見つかりません。PCにカメラが接続されているか確認してください。（'+n+'）';

    return 'カメラを起動できません。別のアプリ・会議ソフトがカメラを使用していないか確認してください。（'+n+'）';

  cameraStarting=true;const token=++scanToken;let videoStream=null;
  const start=$('#start');if(start){start.disabled=true;start.textContent='カメラの起動を確認中…'}
  try{
    if(!await ensureQRDecoder()){
      notify('QR解析部品を読み込めません。通信環境を確認してください。');return;
    }
    setQRStatus('QR解析部品：利用可能');
    const constraints=useAny?{video:true,audio:false}:{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false};
    try{videoStream=await navigator.mediaDevices.getUserMedia(constraints)}
    catch(e){
      if(!useAny&&(e.name==='OverconstrainedError'||e.name==='NotFoundError'))
        videoStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
      else throw e;
    }
    if(token!==scanToken){videoStream.getTracks().forEach(t=>t.stop());return}
    scanStream=videoStream;const v=$('#video');if(!v){stopScan();return}
    v.srcObject=scanStream;$('#cam').style.display='block';$('#start').style.display='none';
    await v.play();if(token!==scanToken)return;
    lastQrFrame=0;
    const loop=async()=>{
      if(token!==scanToken||!scanStream)return;
      const now=performance.now();
      if(!scanBusy&&now-lastQrFrame>=140&&v.readyState>=2&&v.videoWidth){
        lastQrFrame=now;
        scanBusy=true;
        try{
          const raw=await decodeQR(v,$('#cv'));
          if(raw&&scanStream&&token===scanToken){stopScan();await onCode(raw);return}
        }catch(e){console.warn('カメラのQR解析に失敗',e)}finally{scanBusy=false}
      }
      if(token===scanToken)scanRaf=requestAnimationFrame(loop);
    };scanRaf=requestAnimationFrame(loop);
  }catch(e){
    if(videoStream)videoStream.getTracks().forEach(t=>t.stop());
    if(scanStream===videoStream)scanStream=null;
    notify(cameraErrorText(e));
  }finally{
    cameraStarting=false;
    if($('#start')){$('#start').disabled=false;$('#start').textContent='カメラを起動する'}
  }
}
function loadQrImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('この画像形式はブラウザで読み込めません。PNGまたはJPEGに変換してください。'))};
    im.src=url;
  });
}
async function photoScan(e){
  const file=e.target.files?.[0];if(!file)return;
  stopScan();
  const chooser=e.target;chooser.disabled=true;
  try{
    if(!file.type.startsWith('image/')&&!/\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(file.name)){
      notify('ExcelファイルはQR画像として読み取れません。QR部分を画像（PNG・JPEG等）として保存してください。');return;
    }
    if(file.size>25*1024*1024){notify('画像が大きすぎます。25MB以下のPNG・JPEG画像を選択してください。');return}
    if(!await ensureQRDecoder()){
      setQRStatus('QR解析部品：利用できません');
      notify('QR解析部品を読み込めませんでした。ネットワーク接続を確認してください。');return;
    }
    setQRStatus('QR画像を解析しています…');
    const im=await loadQrImage(file);
    if(!$('#cv'))return;
    const data=await decodeQR(im,$('#cv'),true);
    if(!data){
      setQRStatus('QR解析部品：利用可能／画像内のQRは検出できませんでした');
      notify('画像は開けましたが、QRコードを検出できませんでした。QR部分を大きく切り出したPNG・JPEG画像で試してください。');return;
    }
    setQRStatus('QRを検出しました。処方IDを照合しています…');
    await onCode(data);
  }catch(e){notify('画像の処理に失敗しました。'+String(e?.message||e).slice(0,150))}
  finally{if(chooser.isConnected){chooser.disabled=false;chooser.value=''}}
}
async function onCode(raw){
  stopScan();
  const qrText=String(raw||'').trim();
  // 古い日付なしQR・MC1・手入力IDを受け付けない。保存時はサーバーでも再検証。
  const p=/^MC2\|(\d{4}-\d{2}-\d{2})\|(\d{4}-\d{2}-\d{2})\|([PG][0-9]{3,8})$/.exec(qrText);
  const range=p&&periodDates(p[1],p[2]);
  if(!p||!range||range.error){renderScan();notify('このQRは本番導入準備版で使用できません。期間付きQRを管理者画面から発行してください。');return;}
  const today=todayJST();
  if(today<p[1]||today>p[2]){renderScan();notify('QRの使用期間外です。新しいQRを発行してください。');return;}
  const code=p[3];
  A.qrText=qrText;
  setLoading('最新の処方と記録を確認しています');
  try{await loadMaster();await loadLogs(todayJST());
    if(/^G[0-9]{3,8}$/.test(code)){
      if(!C.qrReady){renderScan();notify('一包化QR機能のSQLが未設定です。03_QR一包化連携.sqlを確認してください。');return}
      const group=C.qrGroups.find(g=>g.id===code);
      if(!group){renderScan();notify('一包化ID '+code+' は登録されていません。');return}
      A.group=group;A.rx=null;A.groupCheck=verifyGroup(group);renderGroupVerify();return;
    }
    const rx=repo.getPrescription(code);
    if(!rx){renderScan();notify('この処方IDは登録されていません。読み取った内容：'+code.slice(0,60));return}
    if(C.qrReady&&isGroupedPrescription(code)){renderScan();notify('この処方は一包化に含まれています。薬袋のG番号QRでまとめて照合してください。');return}
    A.group=null;
    A.rx=rx;A.check=verify(rx);renderVerify();
  }catch(e){renderScan();notify('サーバーに接続できないため照合を中止しました。'+errorMessage(e))}
}
function verify(rx){
  const now=todayJST(),owner=repo.getResident(rx.residentId),med=repo.getMedicine(rx.medicineId);
  let duplicate=repo.findLog(rx.id,now,rx.timeSlot);
  const checks=[
    [!!owner&&owner.id===A.resident.id,'本人の薬です','登録された利用者と一致しません'],
    [rx.timeSlot===A.slot,'時間帯が一致しました','処方の時間帯は '+rx.timeSlot+' です'],
    [!!owner?.is_active&&!!med?.is_active&&rx.isActive===true,'処方・利用者・薬剤は有効です','無効化された処方・利用者・薬剤です'],
    [!!rx.endDate&&rx.startDate<=now&&now<=rx.endDate,'処方期間内です','処方の開始日・終了日を確認してください（終了日未設定も停止）'],
    [!duplicate,'同じ処方の記録はありません','すでに本日の記録があります']
  ];
  return {ok:checks.every(x=>x[0]),checks,med,duplicate};
}
function verifyGroup(group){
  const date=todayJST(),owner=repo.getResident(group.residentId),rxs=groupRxs(group);
  const missing=rxs.some(rx=>!rx),goodRx=rxs.length>=2&&rxs.every(rx=>rx&&rx.isActive&&
    rx.residentId===group.residentId&&rx.timeSlot===group.timeSlot&&
    rx.startDate===group.startDate&&rx.endDate===group.endDate&&
    rx.startDate<=date&&date<=rx.endDate&&!!repo.getMedicine(rx.medicineId)?.is_active);
  const duplicates=rxs.filter(rx=>rx&&!!repo.findLog(rx.id,date,rx.timeSlot));
  const checks=[
    [!!owner&&owner.id===A.resident?.id,'利用者が一致しました','利用者が一致しません'],
    [group.timeSlot===A.slot,'時間帯が一致しました','時間帯が異なります'],
    [group.isActive===true&&!!owner?.is_active,'一包化登録は有効です','無効化された一包化・利用者です'],
    [group.startDate<=date&&date<=group.endDate,'有効な服薬期間です','一包化の服薬期間外です'],
    [!missing&&goodRx,'すべての薬剤・処方は有効です','処方や薬剤に無効または不整合があります'],
    [!duplicates.length,'記録の重複はありません','一包化内に記録済みの薬があります']
  ];
  return {ok:checks.every(x=>x[0]),checks,rxs,duplicates};
}

  <div class="status-summary-item"><span class="status-count">${pending}件</span><span class="status-heading">未確認</span></div>
  <div class="status-summary-item alert"><span class="status-count">${attention}件</span><span class="status-heading">未服薬・拒否</span></div></div>
  <div class="info-panel">${esc(day)} ／ 対象${rows.length}処方。最新の情報を見るときは「更新」を押してください。終了日が未設定の処方は表示しません。</div>
  ${SLOTS.filter(t=>slot==='すべて'||slot===t).map(t=>{let list=rows.filter(x=>x.rx.timeSlot===t);return list.length?`<section class="card status-group"><div class="status-group-head"><h3>${t}</h3><small>${list.length}件</small></div>
  ${list.map(x=>`<div class="status-entry"><div class="status-entry-info"><div class="status-person">${esc(repo.getResident(x.rx.residentId)?.name)}<span class="status-room">${esc(repo.getResident(x.rx.residentId)?.room||'—')}号室</span></div>
  <div class="status-med">${esc(repo.getMedicine(x.rx.medicineId)?.name)} ／ ${esc(x.rx.dose)}</div>
  </div><div class="status-result"><span class="status-pill ${x.status==='服薬済み'?'done':x.status==='未確認'?'pending':'attention'}">${esc(x.status)}</span>
  ${x.log?`<span class="status-record-time">${hm(x.log.createdAt)}</span>`:''}</div></div>`).join('')}</section>`:''}).join('')||'<div class="status-empty">対象の処方はありません。</div>'}
  <button class="pri" id="refresh">最新の情報に更新</button><button id="history">服薬履歴を見る</button><button id="back">確認画面に戻る</button>`;
  $('#date').onchange=e=>{if(e.target.value)showStatus(e.target.value,slot)};
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>showStatus(day,b.dataset.slot));
  $('#refresh').onclick=()=>showStatus(day,slot);$('#history').onclick=()=>showHistory(day);$('#back').onclick=home;
}
async function showHistory(date=A.historyDate){stopScan();screen='history';A.historyDate=date;updateHeader();setLoading('服薬履歴を読み込んでいます');
  try{await loadMaster();await loadLogs(date);renderHistory()}catch(e){renderLoadFail('服薬履歴を読み込めませんでした。'+errorMessage(e),()=>showHistory(date))}
}
function renderHistory(){screen='history';updateHeader();const logs=C.logs.filter(l=>!A.historyResident||l.residentId===A.historyResident);
  $('#app').innerHTML=`<span class="section-label">サーバー共有 / 履歴</span><h2>服薬履歴・訂正履歴</h2>
  <p class="lead">原記録は残し、訂正は別の履歴として追記します。訂正できるのは管理者だけです。</p>
  <div class="card history-tools"><div><label for="hist-date">日付</label><input id="hist-date" type="date" value="${esc(A.historyDate)}"></div>
  <div><label for="hist-person">利用者</label><select id="hist-person"><option value="">全員</option>${C.residents.map(r=>`<option value="${esc(r.id)}" ${A.historyResident===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div>
  <div class="table-wrap"><table><tr><th>時刻</th><th>利用者</th><th>薬・時間帯</th><th>現在の結果</th><th>担当</th><th>操作</th></tr>
  ${logs.map(l=>{const changes=repo.getCorrections(l.id),now=repo.getCurrentStatus(l);
    return `<tr class="${now!=='服薬済み'?'bad':''}"><td>${hm(l.createdAt)}</td>
    <td>${esc(repo.getResident(l.residentId)?.name||'不明')}</td>
    <td>${esc(repo.getMedicine(l.medicineId)?.name||'不明')}<br>${esc(l.timeSlot)}</td>
    <td>${esc(now)}${changes.length?`<br><small>訂正${changes.length}回</small>`:''}</td>
    <td>${esc(repo.getStaff(l.staffId)?.name||l.staffId)}</td><td><button class="action-link" data-audit="${esc(l.id)}">変更履歴</button>${staff.role==='admin'?`<button class="action-link" data-correct="${esc(l.id)}">訂正する</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6">記録がありません</td></tr>'}</table></div>
  ${staff.role==='admin'?'<button id="csv">この日の履歴CSVを出力（管理者のみ）</button>':''}
  <button class="pri" id="refresh">最新の情報に更新</button><button id="status">服薬状況を見る</button><button id="back">確認画面に戻る</button>`;
  $('#hist-date').onchange=e=>{if(e.target.value)showHistory(e.target.value)};
  $('#hist-person').onchange=e=>{A.historyResident=e.target.value;renderHistory()};
  document.querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>showAudit(b.dataset.audit));
  document.querySelectorAll('[data-correct]').forEach(b=>b.onclick=()=>showCorrection(b.dataset.correct));
  if($('#csv'))$('#csv').onclick=()=>exportCsv(logs);
  $('#refresh').onclick=()=>showHistory(A.historyDate);$('#status').onclick=()=>showStatus();$('#back').onclick=home;
}
function closeModal(d){d.remove()}
function modal(html){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card correction-modal">${html}</div>`;document.body.appendChild(d);return d}
function showAudit(logId){const log=C.logs.find(l=>l.id===logId);if(!log)return;const changes=repo.getCorrections(logId);
  const d=modal(`<h2 style="font-size:22px">記録の変更履歴</h2><div class="audit-items">
  <div class="audit-entry"><b>初回：${esc(log.status)}</b><br><small>${esc(log.createdAt)} ／ ${esc(repo.getStaff(log.staffId)?.name||log.staffId)}</small>${log.reason?`<p>${esc(log.reason)}</p>`:''}</div>
  ${changes.map(c=>`<div class="audit-entry"><b>${esc(c.fromStatus)} → ${esc(c.toStatus)}</b><br><small>${esc(c.createdAt)} ／ ${esc(repo.getStaff(c.staffId)?.name||c.staffId)}</small><p>理由：${esc(c.reason)}</p></div>`).join('')}</div>
  <button class="pri" id="close">閉じる</button>`);d.querySelector('#close').onclick=()=>closeModal(d);
}
function showCorrection(logId){if(staff.role!=='admin')return;const log=C.logs.find(l=>l.id===logId);if(!log)return;const expected=repo.getCurrentStatus(log);
  const d=modal(`<h2 style="font-size:22px">服薬記録を訂正</h2><p class="lead">原記録を変更せず訂正履歴を追加します。管理者ログインが必要です。</p>
  <div class="info-panel">初回：${esc(log.status)} ／ 現在：${esc(expected)}<br>訂正担当：${esc(staff.name)}</div>
  <label for="new-status">訂正後の結果</label><select id="new-status">${STATUSES.map(x=>`<option value="${x}" ${x===expected?'selected':''}>${x}</option>`).join('')}</select>
  <label for="corr-reason">訂正理由（5文字以上）</label><textarea id="corr-reason" maxlength="1000" placeholder="理由を具体的に入力してください"></textarea>
  <div id="modal-error"></div><div class="row"><button id="cancel">戻る</button><button class="pri" id="commit">訂正を保存</button></div>`);
  d.querySelector('#cancel').onclick=()=>closeModal(d);
  d.querySelector('#commit').onclick=async()=>{
    const status=d.querySelector('#new-status').value,reason=d.querySelector('#corr-reason').value.trim();
    if(status===expected||reason.length<5){d.querySelector('#modal-error').innerHTML='<div class="err">結果を変更し、5文字以上の理由を入力してください。</div>';return}
    if(!confirm('訂正履歴を追加しますか？原記録は変更されません。'))return;
    const btn=d.querySelector('#commit');btn.disabled=true;
    try{
      const {data,error}=await client.rpc('medcheck_correct_medication',{p_log_id:logId,p_expected_status:expected,p_new_status:status,p_reason:reason});
      if(error)throw error;
      if(data?.result!=='corrected')throw new Error(data?.message||'訂正を保存できませんでした。');
      closeModal(d);await showHistory(A.historyDate);
    }catch(e){d.querySelector('#modal-error').innerHTML=`<div class="err">${esc('訂正が確認できませんでした。再度実行する前に履歴を確認してください。 '+errorMessage(e))}</div>`;btn.disabled=false}
  };
}
function exportCsv(logs){
  const cell=x=>{let str=String(x??'');if(/^[\s]*[=+@-]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'};
  const rows=[['日付','時刻','利用者','薬剤','処方ID','時間帯','初回結果','現在の結果','担当者','訂正回数']].concat(logs.map(l=>[
    l.date,hm(l.createdAt),repo.getResident(l.residentId)?.name,repo.getMedicine(l.medicineId)?.name,l.prescriptionId,l.timeSlot,l.status,repo.getCurrentStatus(l),repo.getStaff(l.staffId)?.name,repo.getCorrections(l.id).length
  ]));
  const blob=new Blob(['\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='服薬履歴_'+A.historyDate+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function init(){
  const config=window.MEDCHECK_CONFIG||{};
  if(config.environment !== 'staging' && config.environment !== 'production'){
    screen='blocked';updateHeader();$('#app').innerHTML='<h2>環境設定が未完了です</h2><div class="err">config.js の environment は staging または production を指定してください。</div>';return;
  }
  if(config.environment==='production' && (config.releaseApproved!==true || !config.allowedHost || location.hostname!==config.allowedHost)){
    screen='blocked';updateHeader();$('#app').innerHTML='<h2>本番利用はまだ許可されていません</h2><div class="err">施設の承認後に本番用config.jsの許可設定と公開ドメインを確認してください。誤接続防止のためログインを停止しています。</div>';return;
  }
  if(!config.url||config.url.includes('YOUR-PROJECT')||!config.publishableKey||config.publishableKey.includes('PASTE_')){
    screen='blocked';updateHeader();$('#app').innerHTML=`<h2>Supabase接続設定が未完了です</h2><div class="info-panel">config.jsにProject URLとPublishable keyを入力してください。secret key・service_roleキーやデータベースのパスワードは絶対に入れないでください。</div>`;return;
  }
  if(!window.supabase?.createClient){screen='blocked';updateHeader();$('#app').innerHTML='<div class="err">Supabaseライブラリを読み込めません。ネットワーク接続を確認してください。</div>';return}
  // URLを開くたびにログイン画面から開始するため、認証情報をブラウザに保存しない。
  client=window.supabase.createClient(config.url,config.publishableKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
  $('#menu-toggle').onclick=()=>{$('#admin-drawer').hidden?openAdminMenu():closeAdminMenu()};
  $('#admin-menu-overlay').onclick=closeAdminMenu;
  $('#drawer-close').onclick=()=>{closeAdminMenu();$('#menu-toggle').focus()};
  document.querySelectorAll('#admin-drawer [data-go]').forEach(b=>b.onclick=()=>goAdminMenu(b.dataset.go));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#admin-drawer').hidden){closeAdminMenu();$('#menu-toggle').focus()}});
  $('#logout').onclick=async()=>{stopScan();try{await client.auth.signOut()}finally{user=null;staff=null;C.staff=[];C.residents=[];C.medicines=[];C.prescriptions=[];C.logs=[];C.corrections=[];C.qrGroups=[];C.qrGroupItems=[];C.qrReady=false;renderLogin()}};
  client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){stopScan();user=null;staff=null;C.staff=[];C.residents=[];C.medicines=[];C.prescriptions=[];C.logs=[];C.corrections=[];C.qrGroups=[];C.qrGroupItems=[];C.qrReady=false;A.qrText=null;renderLogin()}});
  // 初回表示は必ずログイン画面。職員権限はログインに成功した後で初めて確認する。
  renderLogin();
}
init();
</script></body></html>
