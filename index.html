<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>&#x670d;&#x85ac;&#x78ba;&#x8a8d;</title>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
/* ---------- Base ---------- */
:root {
  --page: #f5f6f3;
  --paper: #ffffff;
  --ink: #26332f;
  --muted: #64726c;
  --line: #d9e0db;
  --main: #286a5d;
  --main-dark: #1b5147;
  --main-soft: #eaf3ef;
  --danger: #a33d36;
  --danger-soft: #fff3f1;
  --warning-soft: #fcf7ed;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
  letter-spacing: .01em;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #8dbaa8; outline-offset: 2px; }
button:disabled { opacity: .46; cursor: not-allowed; }

/* ---------- Header / progress ---------- */
header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: auto;
  padding: 21px 24px 17px;
  max-width: 760px;
}
.brand { display: flex; flex-direction: column; line-height: 1.25; gap: 2px; }
.brand-label { color: var(--main); font-weight: 700; font-size: 11px; letter-spacing: .15em; }
.brand-name { font-size: 24px; font-weight: 750; letter-spacing: .035em; }
#who { font-size: 14px; font-weight: 600; color: var(--muted); text-align: right; }
.steps {
  display: flex;
  gap: 0;
  max-width: 712px;
  margin: 0 auto;
  padding: 0 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.steps::-webkit-scrollbar { display: none; }
.steps span {
  position: relative;
  flex: 1 0 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 13px 2px 12px;
  border-bottom: 3px solid transparent;
  color: #7b8881;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.steps span::before {
  content: attr(data-number);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  border: 1px solid #c9d2cc;
  border-radius: 50%;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: #748079;
}
.steps span.on { color: var(--main-dark); border-color: var(--main); }
.steps span.on::before { color: #fff; background: var(--main); border-color: var(--main); }
.steps span.done { color: #546c5e; }
.steps span.done::before { color: var(--main); border-color: var(--main); }
.steps span.history-step { flex: 0 0 auto; padding-left: 10px; padding-right: 10px; }
.steps span.history-step::before { display: none; }

/* ---------- Content ---------- */
main { margin: 0 auto; max-width: 712px; padding: 27px 22px 68px; }
h2 { font-size: clamp(24px, 5vw, 29px); font-weight: 750; line-height: 1.4; letter-spacing: -.035em; margin: 0 0 10px; }
h3 { font-size: 17px; margin: 0 0 13px; font-weight: 700; }
p { margin: 9px 0 14px; }
.lead { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 22px; }
.section-label { display: block; margin: 0 0 8px; color: var(--main); font-size: 12px; font-weight: 750; letter-spacing: .1em; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 15px;
}
.card > b:first-child { font-weight: 700; }
.card .hint:last-child { margin-bottom: 0; }
.hint { color: var(--muted); font-size: 14px; line-height: 1.65; }
.big { font-size: 27px; font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
.detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px 19px; }
.detail-item { display: inline-flex; align-items: baseline; gap: 8px; }
.detail-item small { font-size: 13px; color: var(--muted); }
.detail-item b { font-size: 17px; }

/* ---------- Buttons / form controls ---------- */
button, .btn {
  display: block;
  width: 100%;
  min-height: 54px;
  background: var(--paper);
  border: 1px solid #c9d4cd;
  border-radius: 9px;
  color: var(--ink);
  text-align: center;
  padding: 13px 19px;
  margin: 10px 0;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.45;
  transition: background .12s, border-color .12s;
}
button:not(:disabled):active { background: #edf2ee; }
button.pri, button.ok {
  background: var(--main);
  color: #fff;
  border-color: var(--main);
}
button.pri:not(:disabled):active, button.ok:not(:disabled):active { background: var(--main-dark); }
button.ng { color: var(--danger); border-color: #e4b7b2; background: #fff; }
button.ng:not(:disabled):active { background: var(--danger-soft); }
button.sel { border-color: var(--main); background: var(--main-soft); color: var(--main-dark); box-shadow: inset 0 0 0 1px var(--main); }
button.sel.pri { color: #fff; background: var(--main); }
button.staff-choice, button.rc {
  display: flex; align-items: center; justify-content: space-between;
  text-align: left; padding: 18px 20px; min-height: 72px; margin: 0 0 9px;
}
button.staff-choice::after, button.rc::after {
  content: ''; display: block; width: 8px; height: 8px;
  border-top: 2px solid #778b81; border-right: 2px solid #778b81;
  transform: rotate(45deg); flex-shrink: 0; margin-left: 14px;
}
/* 職員欄：タップすると直下に一覧を展開 */
.staff-field { margin: 0 0 22px; }
.staff-field-label { display: block; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 9px; }
button.staff-dropdown-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 64px; margin: 0; padding: 14px 17px;
  border: 1px solid #b8c7be; background: #fff; text-align: left;
  font-size: 17px; font-weight: 600; color: var(--muted);
}
button.staff-dropdown-toggle.has-value { color: var(--ink); }
button.staff-dropdown-toggle[aria-expanded="true"] {
  border-color: var(--main); border-radius: 9px 9px 0 0;
  box-shadow: inset 0 0 0 1px var(--main);
}
.staff-chevron {
  display: block; flex: 0 0 10px; width: 10px; height: 10px;
  border-right: 2px solid var(--main); border-bottom: 2px solid var(--main);
  transform: rotate(45deg); transition: transform .15s ease;
  margin-right: 4px; margin-top: -5px;
}
button.staff-dropdown-toggle[aria-expanded="true"] .staff-chevron { transform: rotate(225deg); margin-top: 5px; }
.staff-dropdown-list {
  display: grid; background: #fff; border: 1px solid var(--main); border-top: none;
  border-radius: 0 0 9px 9px;
  max-height: 300px;  /* 4〜5名が見える高さで固定 */
  overflow-y: auto;   /* 職員が多い場合は一覧の内側をスクロール */
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #8ba69b #edf2ef;
}
.staff-dropdown-list::-webkit-scrollbar { width: 9px; }
.staff-dropdown-list::-webkit-scrollbar-track { background: #edf2ef; }
.staff-dropdown-list::-webkit-scrollbar-thumb {
  background: #8ba69b;
  border-radius: 6px;
  border: 2px solid #edf2ef;
}
.staff-dropdown-list[hidden] { display: none; }
button.staff-option {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0; padding: 13px 18px; min-height: 58px; border: 0;
  border-bottom: 1px solid var(--line); border-radius: 0;
  text-align: left; background: #fff; font-size: 17px; font-weight: 600;
}
button.staff-option:last-child { border-bottom: none; }
button.staff-option.selected { background: var(--main-soft); color: var(--main-dark); }
button.staff-option small { color: var(--main); font-size: 12px; font-weight: 650; }
button.staff-option:not(:disabled):active { background: var(--main-soft); }
button.rc { justify-content: flex-start; gap: 14px; }
button.rc::after { margin-left: auto; }
.rc img { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
.rc .resident-name { font-size: 19px; font-weight: 750; display: block; }
.rc .resident-info { font-size: 13px; font-weight: 500; color: var(--muted); display: block; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0 10px; }
.grid button { margin: 0; min-height: 56px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
#back:not(.ng) { background: transparent; border: 0; color: var(--muted); text-align: left; font-size: 14px; padding: 10px 0; margin-top: 18px; min-height: 42px; width: auto; }
#hist, #n3 { margin-top: 17px; background: transparent; border-color: var(--line); font-size: 15px; }
#stop { background: transparent; border-color: var(--line); color: var(--muted); font-size: 15px; }
#rst { border: 1px solid #e7c4c1; background: #fff; color: var(--danger); font-size: 15px; }
input, select, textarea {
  display: block; width: 100%; min-height: 51px; background: #fff;
  border: 1px solid #bdcac2; border-radius: 8px; padding: 11px 13px;
  color: var(--ink); font-size: 16px;
}
input::placeholder, textarea::placeholder { color: #84928a; }
input + button, textarea + button { margin-top: 12px; }
select { cursor: pointer; }
textarea { resize: vertical; min-height: 100px; }
label.ack { display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; font-weight: 700; font-size: 15px; }
label.ack input { width: 21px; height: 21px; min-height: 0; flex-shrink: 0; accent-color: var(--main); }
.photo { width: 132px; height: 132px; border-radius: 9px; object-fit: cover; border: 1px solid var(--line); margin-bottom: 8px; }
.person-card { text-align: center; padding: 29px 20px; }
.person-card .person-room { display: inline-block; margin-top: 14px; padding: 4px 15px; border-radius: 5px; background: var(--page); color: var(--muted); font-weight: 700; font-size: 14px; }

/* ---------- QR / status ---------- */
.qrguide {
  background: var(--warning-soft);
  border: 1px solid #eee1c8;
  border-left: 3px solid #c9a367;
  border-radius: 7px;
  padding: 13px 16px;
  font-size: 14px;
  line-height: 1.7;
  margin: 14px 0 19px;
}
.qrguide b { color: #5f4c2c; }
#cam { padding: 5px 0 12px; }
#cam video, video { width: 100%; max-height: 56vh; display: block; object-fit: contain; background: #14211f; border-radius: 10px; }
#qrphoto { font-size: 14px; padding: 10px; min-height: 53px; }
.err { background: var(--danger-soft); border-left: 4px solid var(--danger); color: #832f2c; border-radius: 5px; padding: 12px 15px; margin: 14px 0; font-size: 15px; font-weight: 650; line-height: 1.7; overflow-wrap: anywhere; }
.res { text-align: left; padding: 23px 23px 24px; border: 1px solid var(--line); border-left: 5px solid var(--main); background: #fff; border-radius: 9px; margin: 0 0 18px; }
.res.ok { border-left-color: var(--main); }
.res.ng { border-left-color: var(--danger); background: var(--danger-soft); border-top-color: #f0d6d3; border-right-color: #f0d6d3; border-bottom-color: #f0d6d3; }
.res .result-label { font-size: 13px; font-weight: 750; color: var(--main); margin-bottom: 5px; }
.res.ng .result-label { color: var(--danger); }
.res .big { font-size: 27px; }
.res .result-note { font-size: 15px; color: var(--muted); margin-top: 2px; }
.res.ng .result-note { color: #89463e; }
.chk { padding: 0; margin: 0; list-style: none; }
.chk li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 2px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #e4e9e5; }
.chk li:first-child { padding-top: 3px; }
.chk li:last-child { border: 0; padding-bottom: 3px; }
.chk li::before { content: '確認'; background: var(--main-soft); color: var(--main-dark); padding: 2px 7px; font-size: 11px; font-weight: 750; border-radius: 4px; flex: 0 0 auto; }
.chk li.f::before { content: '注意'; color: var(--danger); background: #fbe6e3; }
.chk li.f { color: #8f3630; }
.warnbox { background: var(--danger-soft); color: #86332d; border: 1px solid #edccc7; border-left: 4px solid var(--danger); border-radius: 7px; padding: 15px 18px; font-weight: 700; font-size: 16px; margin-bottom: 15px; }
.status-choice.sel.ok { background: var(--main-soft); color: var(--main-dark); border-color: var(--main); }
.status-choice.sel.ng { background: var(--danger-soft); color: #8f3630; border-color: var(--danger); }
.ov { position: fixed; inset: 0; background: rgb(19 34 30 / 57%); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 20; }
.ov .card { width: 100%; max-width: 440px; margin: 0; box-shadow: 0 18px 60px rgb(0 0 0 / 13%); }

/* ---------- Status overview ---------- */
.status-toolbar { display: grid; gap: 17px; }
.status-date-label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
/* 服薬状況一覧：日付欄を画面幅に合わせて広げ、スマホ・iPadでも枠内に収める */
.status-toolbar > div:first-child { min-width: 0; max-width: 100%; }
.status-date-field {
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: 390px;
  min-width: 0;
  min-inline-size: 0;
  overflow: hidden;
  font-size: 16px;
}
.status-tabs { display: flex; flex-wrap: wrap; gap: 7px; }
.status-tabs button {
  flex: 1 1 90px; min-height: 44px; margin: 0; padding: 9px 8px;
  font-size: 14px; font-weight: 700; border-radius: 999px;
  background: #f3f6f4; color: #3e5b4e; border-color: #d7e2db;
}
.status-tabs button.active { background: #dcefe5; color: #205d43; border-color: #a5cdb9; }
.status-tabs button:hover:not(.active) { background: #eaf3ee; }
.status-progress { padding: 17px 20px; margin-bottom: 12px; }
.status-progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.status-progress-head strong { font-size: 15px; font-weight: 750; }
.status-progress-count { font-size: 14px; color: var(--main-dark); font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.status-progress-track { height: 13px; background: #edf2ee; border-radius: 999px; overflow: hidden; }
.status-progress-fill { height: 100%; background: #76ad8d; border-radius: inherit; transition: width .2s ease; }
.status-progress-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.status-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.status-summary-item { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 15px 12px; min-width: 0; }
.status-summary-item .status-count { display: block; font-size: 30px; line-height: 1.3; font-weight: 750; font-variant-numeric: tabular-nums; }
.status-summary-item .status-count small { font-size: 12px; font-weight: 650; margin-left: 2px; }
.status-summary-item .status-heading { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 3px; }
.status-summary-item.completed .status-count { color: var(--main-dark); }
.status-summary-item.alert .status-count { color: var(--danger); }
.status-note { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 6px 0 19px; }
.status-group { padding: 0; overflow: hidden; }
.status-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: #f7f9f7; padding: 14px 19px; border-bottom: 1px solid var(--line); }
.status-group-head h3 { margin: 0; font-size: 17px; }
.status-group-head small { color: var(--muted); font-size: 12px; font-weight: 650; }
.status-entry { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
.status-entry:last-child { border-bottom: 0; }
.status-person { font-size: 16px; font-weight: 750; line-height: 1.4; }
.status-room { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 8px; }
.status-med { font-size: 14px; line-height: 1.5; margin-top: 6px; }
.status-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
.status-result { display: flex; align-items: flex-end; flex-direction: column; gap: 5px; flex: 0 0 auto; }
.status-pill { white-space: nowrap; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: 750; }
.status-pill.done { background: var(--main-soft); color: var(--main-dark); }
.status-pill.pending { background: #eff1f0; color: #56635c; }
.status-pill.attention { background: #fbe7e4; color: var(--danger); }
.status-record-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.status-empty { background: #fff; border: 1px dashed #bdcac2; border-radius: 10px; padding: 26px 20px; text-align: center; color: var(--muted); font-size: 15px; }
/* ---------- 訂正履歴 ---------- */
.demo-global { padding: 7px 16px; background: #fcf7ed; border-bottom: 1px solid #e6d7b7; color: #745c31; font-size: 12px; font-weight: 700; text-align: center; }

.demo-safety { background: #fcf7ed; border: 1px solid #dfcda6; border-left: 4px solid #ae8744; padding: 13px 16px; border-radius: 7px; margin: 12px 0 22px; font-size: 14px; line-height: 1.7; }
.history-action { width: auto; min-height: 36px; display: inline-block; padding: 7px 10px; margin: 3px 4px 3px 0; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.history-revised { color: var(--main-dark); font-size: 12px; font-weight: 750; }
.history-before { color: var(--muted); font-size: 12px; }
.audit-items { margin: 15px 0; max-height: 42vh; overflow-y: auto; padding: 0 5px 0 0; }
.audit-entry { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.audit-entry:last-child { border-bottom: 0; }
.audit-entry small { color: var(--muted); }
.correction-modal { max-height: 88vh; overflow-y: auto; }
.correction-modal label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 7px; }
.correction-modal .lead { margin-bottom: 10px; }
.correction-modal textarea { min-height: 105px; }
/* ---------- Log ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; margin-bottom: 17px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 570px; }
th { color: var(--muted); font-size: 12px; font-weight: 750; background: #f4f7f4; }
th, td { border-bottom: 1px solid var(--line); padding: 12px 13px; text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.bad { color: var(--danger); background: var(--danger-soft); }
tr.bad td { font-weight: 650; }
.history-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.history-tools label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 6px; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  .header-inner { padding: 18px 17px 14px; }
  .brand-name { font-size: 22px; }
  #who { font-size: 12px; }
  .steps { padding: 0 6px; }
  .steps span { flex-direction: column; gap: 3px; font-size: 11px; padding: 9px 0 8px; }
  .steps span::before { width: 19px; height: 19px; flex-basis: 19px; }
  main { padding: 24px 16px 55px; }
  .card { padding: 17px 16px; }
  button.staff-choice, button.rc { padding: 16px; }
  .big, .res .big { font-size: 23px; }
  .row { flex-direction: column; gap: 0; }
  .history-tools { grid-template-columns: 1fr; }
  .status-summary { gap: 7px; }
  .status-summary-item { padding: 13px 9px; }
  .status-summary-item .status-count { font-size: 27px; }
  .status-summary-item .status-heading { font-size: 11px; }
  .status-entry { padding: 15px 14px; }
  .status-group-head { padding: 13px 14px; }
  .status-person { font-size: 15px; }
  .status-med { font-size: 13px; }
  .status-pill { padding: 5px 8px; }

}
@media (prefers-reduced-motion: reduce) { button, .status-progress-fill { transition: none; } }

/* Supabaseログイン関連 */
.login-shell {max-width:500px; margin:20px auto}
.login-shell .err {white-space:pre-line; overflow-wrap:anywhere;}
.login-shell label {font-size:14px;font-weight:700;display:block;margin:12px 0 5px}
.login-shell input {margin-bottom:8px}
.info-panel {border:1px solid #d9e0db;background:#f7faf8;border-left:4px solid var(--main);border-radius:8px;padding:14px 16px;margin:13px 0;font-size:14px}
.safety-panel {border:1px solid #ebd2aa;background:#fffaf0;border-left:4px solid #c59a4a;border-radius:8px;padding:13px 15px;margin:15px 0;font-size:14px}
.toolbar {display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.toolbar button {width:auto;flex:1;min-width:108px;margin:0;padding:10px 8px;min-height:46px;font-size:14px}
.staff-roster {max-height:300px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--main) #e8ede8}
.staff-roster::-webkit-scrollbar {width:9px}

/* ---------- 2026-11: QR使用期間のスマホ/タブレット表示修正 ----------
 * iOS Safari等のdate入力はブラウザ固有の最小幅を持つことがある。
 * 印刷条件は端末幅によらず一列にし、入力欄の横方向の衝突を防ぐ。
 * プレビューのQRラベルも画面では一列表示し、紙への印刷は別途3列。
 */
#qr-content, #qr-filters, #qr-filters .qr-options,
#qr-page, #qr-page .qr-label-grid, #qr-page .qr-label {
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
}
#qr-filters .qr-options {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:12px;
}
#qr-filters .qr-options > div {
  min-width:0;
  width:100%;
  max-width:100%;
}
#qr-filters .qr-options label {
  display:block;
  max-width:100%;
  overflow-wrap:anywhere;
  line-height:1.5;
  margin:0 0 6px;
}
#qr-filters .qr-options input,
#qr-filters .qr-options select,
#qr-filters .qr-options input[type="date"] {
  display:block;
  box-sizing:border-box;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:100%;
  width:100%;
  min-width:0;
  max-width:100%;
  font-size:16px;
  line-height:normal;
  padding:10px 12px;
  margin:0;
}
#qr-filters .qr-options input[type="date"] {
  overflow:hidden;
  text-overflow:clip;
}
#qr-page .qr-label-grid {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:center;
  gap:16px;
}
#qr-page .qr-label {
  width:100%;
  max-width:410px;
  min-width:0;
  overflow:hidden;
}
#qr-page .qr-label-date {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  overflow-wrap:anywhere;
  white-space:normal;
}
#qr-page .qr-label-date-range {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  width:100%;
  min-width:0;
  max-width:100%;
  font-size:clamp(12px,2.4vw,15px);
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  white-space:normal;
}
#qr-page .qr-label-date-range > span {
  display:block;
  max-width:100%;
  overflow-wrap:anywhere;
  white-space:normal;
}
@media print {
  body.qr-print-view #qr-page .qr-label-grid {
    grid-template-columns:repeat(3,minmax(0,1fr));
    justify-items:stretch;
    gap:5mm;
  }
  body.qr-print-view #qr-page .qr-label {
    width:100%;
    max-width:none;
    min-width:0;
  }
  body.qr-print-view #qr-page .qr-label-date-range {
    font-size:9pt;
    line-height:1.3;
  }
}

/* ---------- 2026-11 iPad Safari 日付入力の枠はみ出し再修正 ----------
 * iOS/iPadOS Safari の input[type=date] は日付コントロールの内側幅が
 * padding / border 分だけ広く算出される場合がある。
 * 表示上の枠は親要素で管理し、native picker は入力そのものに残す。
 */
#qr-filters .qr-options > .qr-date-field {
  box-sizing:border-box;
  min-width:0;
  max-width:100%;
  width:100%;
}
#qr-filters .qr-native-date-wrap {
  display:block;
  position:relative;
  box-sizing:border-box;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  background:#fff;
  border:1px solid #bdcac2;
  border-radius:8px;
}
#qr-filters .qr-native-date-wrap:focus-within {
  outline:3px solid #8dbaa8;
  outline-offset:2px;
}
#qr-filters .qr-native-date-wrap > input[type="date"] {
  display:block;
  /* iPad Safari が box-sizing を無視しても padding(12px×2) を加えた幅が枠内になる */
  box-sizing:content-box;
  width:calc(100% - 24px);
  inline-size:calc(100% - 24px);
  min-width:0;
  min-inline-size:0;
  max-width:calc(100% - 24px);
  max-inline-size:calc(100% - 24px);
  min-height:49px;
  border:0;
  border-radius:0;
  padding:10px 12px;
  margin:0;
  background:transparent;
  color:var(--ink);
  font-size:16px;
  line-height:normal;
  text-align:center;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
#qr-filters .qr-native-date-wrap > input[type="date"]:focus-visible {
  outline:none;
}
/* QR使用期間以外の項目と揃える。タブレットでも1列のまま。 */
#qr-filters .qr-options {
  width:100%;
  max-width:100%;
  grid-template-columns:minmax(0,1fr);
}
@media (max-width:1100px) {
  #qr-content, #qr-filters, #qr-filters .qr-options,
  #qr-filters .qr-date-field, #qr-filters .qr-native-date-wrap {
    box-sizing:border-box;
    min-width:0;
    max-width:100%;
  }
}


/* ---------- 服薬履歴・訂正画面：スマホ / タブレットの専用レイアウト ----------
 * 横幅固定の6列表は使わず、日時・利用者・薬を1件ごとに表示。
 * iPadOS Safariの日付コントロールは外枠で幅を管理。
 */
#history-view, #history-view * { box-sizing:border-box; }
#history-view { min-width:0; max-width:100%; }
#history-view .history-tools {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:13px;
  padding:clamp(14px,3vw,20px);
  max-width:100%;
}
#history-view .history-filter-field { min-width:0; width:100%; max-width:100%; }
#history-view .history-filter-field label { margin-bottom:7px; overflow-wrap:anywhere; }
#history-view .history-filter-field input,
#history-view .history-filter-field select {
  display:block; box-sizing:border-box; width:100%; min-width:0; max-width:100%;
  font-size:16px; margin:0;
}
#history-view .history-date-frame {
  width:100%; min-width:0; max-width:100%; box-sizing:border-box;
  border:1px solid #bdcac2; border-radius:8px; background:#fff;
  overflow:hidden;
}
#history-view .history-date-frame:focus-within {
  outline:3px solid #8dbaa8; outline-offset:2px;
}
#history-view .history-date-frame input[type="date"] {
  display:block;
  box-sizing:border-box;
  inline-size:100%; width:100%; min-inline-size:0; min-width:0;
  max-inline-size:100%; max-width:100%; min-height:50px;
  padding:10px 12px; border:0; border-radius:0; margin:0;
  background:transparent; line-height:normal; text-align:left;
}
#history-view .history-date-frame input[type="date"]:focus-visible { outline:none; }
#history-view .history-records { display:grid; grid-template-columns:minmax(0,1fr); gap:13px; margin:0 0 18px; min-width:0; }
#history-view .history-record-card {
  display:grid; gap:15px;
  min-width:0; max-width:100%; overflow:hidden;
  background:var(--paper); border:1px solid var(--line); border-radius:12px;
  padding:clamp(14px,3vw,19px);
}
#history-view .history-record-card.history-needs-attention { border-left:4px solid #c17b65; }
#history-view .history-record-head {
  display:flex; flex-wrap:wrap; align-items:flex-start;
  justify-content:space-between; gap:9px 12px; min-width:0;
}
#history-view .history-record-title { min-width:0; flex:1 1 160px; }
#history-view .history-record-title strong {
  display:block; font-size:17px; line-height:1.45; overflow-wrap:anywhere;
}
#history-view .history-record-title small {
  display:block; color:var(--muted); font-size:13px; margin-top:4px;
}
#history-view .history-record-status {
  flex:0 1 auto; max-width:100%; white-space:normal;
  padding:5px 11px; border-radius:7px; background:var(--main-soft);
  color:var(--main-dark); font-size:13px; font-weight:750; overflow-wrap:anywhere;
}
#history-view .history-record-status.attention { background:var(--danger-soft); color:var(--danger); }
#history-view .history-record-details {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px 14px; margin:0; min-width:0;
}
#history-view .history-record-details > div { min-width:0; overflow-wrap:anywhere; }
#history-view .history-record-details dt { font-size:12px; font-weight:700; color:var(--muted); }
#history-view .history-record-details dd { margin:3px 0 0; font-size:15px; font-weight:650; line-height:1.55; overflow-wrap:anywhere; }
#history-view .history-record-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; min-width:0; }
#history-view .history-record-actions.single { grid-template-columns:minmax(0,1fr); }
#history-view .history-record-actions button {
  display:block; width:100%; min-width:0; min-height:46px;
  margin:0; padding:10px 8px; font-size:14px; white-space:normal;
  overflow-wrap:anywhere;
}
#history-view .history-record-actions button.history-correct-button {
  color:var(--main-dark); border-color:var(--main);
}
#history-view .history-empty {
  padding:24px 18px; text-align:center; border:1px dashed var(--line);
  background:#fff; border-radius:10px; color:var(--muted);
}
/* 訂正・変更履歴のダイアログは画面内スクロールにする */
.ov.history-overlay {
  position:fixed; inset:0; z-index:1200;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
          max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  align-items:center; justify-content:center; overflow-x:hidden; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.ov.history-overlay .correction-modal {
  box-sizing:border-box;
  width:min(100%,520px); min-width:0; max-width:520px;
  max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px);
  overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  margin:auto; padding:clamp(15px,3vw,23px);
  overflow-wrap:anywhere;
}
.ov.history-overlay .correction-modal h2,
.ov.history-overlay .correction-modal .lead,
.ov.history-overlay .correction-modal .info-panel,
.ov.history-overlay .correction-modal .audit-entry {
  min-width:0; max-width:100%; overflow-wrap:anywhere;
}
.ov.history-overlay .correction-modal input,
.ov.history-overlay .correction-modal select,
.ov.history-overlay .correction-modal textarea {
  display:block; box-sizing:border-box; width:100%; max-width:100%; min-width:0;
  font-size:16px;
}
.ov.history-overlay .correction-actions {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; min-width:0; margin-top:16px;
}
.ov.history-overlay .correction-actions button { margin:0; min-width:0; max-width:100%; padding:10px 9px; white-space:normal; }
.ov.history-overlay .audit-items {
  width:100%; min-width:0; max-width:100%;
  max-height:45vh; max-height:45dvh;
  overflow-x:hidden; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
@media (max-width:520px) {
  #history-view .history-record-details { grid-template-columns:minmax(0,1fr); gap:10px; }
  #history-view .history-record-actions { grid-template-columns:minmax(0,1fr); }
  .ov.history-overlay .correction-actions { grid-template-columns:minmax(0,1fr); }
}
@media (max-height:530px) {
  .ov.history-overlay { align-items:flex-start; }
}


/* 処方登録: iPhone / Android / iPad Safari の日付入力の枠はみ出し防止 */
#admin-create.admin-form,
#admin-create.admin-form .am-date-field {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  max-width: 100%;
}
#admin-create.admin-form .am-date-field {
  margin: 0;
}
#admin-create.admin-form .am-date-field > label {
  display: block;
  max-width: 100%;
  overflow-wrap: anywhere;
}
#admin-create.admin-form .am-date-frame {
  display: block;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  background: #fff;
  border: 1px solid #bdcac2;
  border-radius: 8px;
}
#admin-create.admin-form .am-date-frame:focus-within {
  outline: 3px solid #8dbaa8;
  outline-offset: 2px;
}
#admin-create.admin-form .am-date-frame > input[type="date"] {
  display: block;
  box-sizing: content-box;
  width: calc(100% - 24px);
  inline-size: calc(100% - 24px);
  min-width: 0;
  min-inline-size: 0;
  max-width: calc(100% - 24px);
  max-inline-size: calc(100% - 24px);
  min-height: 49px;
  margin: 0;
  padding: 10px 12px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  line-height: normal;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
#admin-create.admin-form .am-date-frame > input[type="date"]:focus-visible {
  outline: none;
}

          '\u9078\u629e\u4e2d\u306e\u6642\u9593\u5e2f\uff08' + A.slot + '\uff09\u306b\u3001\u73fe\u5728\u306e\u671f\u9593\u306b\u8a72\u5f53\u3059\u308b\u7121\u52b9\u5316\u6e08\u307f\u51e6\u65b9\u304c' + items.length + '\u4ef6\u3042\u308a\u307e\u3059\u3002\u8a72\u5f53\u3059\u308b\u65b9\u306e\u670d\u85ac\u524d\u306b\u51e6\u65b9\u6307\u793a\u3092\u518d\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002',
          [], false));
      }
    }
    return answer;
  };

  const originalResidentConfirmation = renderConfirmResident;
  renderConfirmResident = function(...args) {
    const answer = originalResidentConfirmation.apply(this, args);
    if (!locked && A.resident) {
      const today = todayJST();
      const items = cancelledInWindow(today, today, A.resident.id, A.slot);
      const yes = document.getElementById('yes');
      if (items.length && yes) {
        yes.before(warningPanel(
          '\u3053\u306e\u5229\u7528\u8005\u306e\u51e6\u65b9\u306b\u6ce8\u610f\u3057\u3066\u304f\u3060\u3055\u3044',
          '\u73fe\u5728\u306e\u671f\u9593\u30fb\u6642\u9593\u5e2f\u306b\u8a72\u5f53\u3059\u308b\u7121\u52b9\u5316\u6e08\u307f\u51e6\u65b9\u304c' + items.length + '\u4ef6\u3042\u308a\u307e\u3059\u3002\u51e6\u65b9\u5909\u66f4\u30fb\u4e2d\u6b62\u306e\u53ef\u80fd\u6027\u3092\u78ba\u8a8d\u3057\u3001\u6700\u65b0\u306e\u85ac\u888b\u3068\u6307\u793a\u3092\u7167\u5408\u3057\u3066\u304f\u3060\u3055\u3044\u3002',
          items, false));
      }
    }
    return answer;
  };

  const originalAdmin = renderAdmin;
  renderAdmin = function(kind, info) {
    const answer = originalAdmin.apply(this, arguments);
    if (!locked && kind === 'prescription' && staff?.role === 'admin') {
      const today = todayJST();
      const weekFromNow = moveDay(today, 7);
      const items = cancelledInWindow(today, weekFromNow, null, null);
      const tabs = document.querySelector('#app .admin-tabs');
      if (items.length && tabs) {
        tabs.before(warningPanel(
          '\u51e6\u65b9\u5909\u66f4\u30fb\u4e2d\u6b62\u306e\u78ba\u8a8d',
          '\u672c\u65e5\u304b\u30897\u65e5\u4ee5\u5185\u306e\u671f\u9593\u306b\u8a72\u5f53\u3059\u308b\u7121\u52b9\u5316\u6e08\u307f\u51e6\u65b9\u304c' + items.length + '\u4ef6\u3042\u308a\u307e\u3059\u3002\u5fc5\u8981\u306b\u5fdc\u3058\u3066\u767b\u9332\u6e08\u307f\u51e6\u65b9\u3068\u65b0\u3057\u3044\u6307\u793a\u3092\u7167\u5408\u3057\u3066\u304f\u3060\u3055\u3044\u3002',
          items, true));
      }
    }
    return answer;
  };

  const originalSetup = renderInitialPasswordChange;
  renderInitialPasswordChange = function(...args) {
    const answer = originalSetup.apply(this, args);
    if (!monitoring) { monitoring = true; lastInput = Date.now(); }
    return answer;
  };

  const originalLogin = renderLogin;
  renderLogin = function(message = '') {
    monitoring = false;
    if (priorTimeout) {
      message = '\u5b89\u5168\u306e\u305f\u3081\u300110\u5206\u9593\u64cd\u4f5c\u304c\u306a\u304b\u3063\u305f\u306e\u3067\u81ea\u52d5\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3057\u305f\u3002\u3082\u3046\u4e00\u5ea6\u30ed\u30b0\u30a4\u30f3\u3057\u3066\u304f\u3060\u3055\u3044\u3002';
      priorTimeout = false;
    }
    return originalLogin.call(this, message);
  };

  function privacyCover() {
    if (!privacyScreen) {
      privacyScreen = document.createElement('div');
      privacyScreen.id = 'medcheck-privacy-cover';
      privacyScreen.setAttribute('role', 'status');
      privacyScreen.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#f5f6f3;color:#26332f;font:600 17px/1.6 sans-serif;text-align:center;padding:24px;';
      privacyScreen.textContent = '\u670d\u85ac\u78ba\u8a8d';
    }
    if (!privacyScreen.isConnected) document.body.appendChild(privacyScreen);
  }
  function removePrivacyCover() {
    if (privacyScreen?.isConnected) privacyScreen.remove();
  }
  function onRealInteraction(event) {
    const block = () => {
      if (event.cancelable) event.preventDefault();
      event.stopImmediatePropagation();
    };
    if (locked) { block(); return; }
    if (!monitoring || event.isTrusted === false) return;
    if (Date.now() - lastInput >= IDLE_MS) {
      block();
      lockForInactivity();
      return;
    }
    lastInput = Date.now();
  }

  function finishIdleSignOut() {
    if (closingSession) return;
    closingSession = true;
    try { sessionStorage.setItem(IDLE_NOTICE_KEY, '1'); } catch (_) {}
    (async () => {
      try {
        await Promise.race([
          client?.auth.signOut() || Promise.resolve(),
          new Promise(resolve => setTimeout(resolve, 4500))
        ]);
      } catch (_) {}
      window.location.reload();
    })();
  }
  function lockForInactivity() {
    if (locked || !monitoring) return;
    locked = true;
    privacyCover();
    try { stopScan(); } catch (_) {}
    if (pendingMedicationSaves) {
      setTimeout(finishIdleSignOut, 15000);
    } else {
      finishIdleSignOut();
    }
  }
  function checkInactivity() {
    if (!monitoring || locked) return;
    if (Date.now() - lastInput >= IDLE_MS) {
      lockForInactivity();
    } else if (!document.hidden) {
      removePrivacyCover();
    }
  }

  const originalSaveMedication = saveRecord;
  saveRecord = async function(...args) {
    if (locked) return;
    pendingMedicationSaves++;
    try { return await originalSaveMedication.apply(this, args); }
    finally { pendingMedicationSaves--; if (locked && pendingMedicationSaves === 0) finishIdleSignOut(); }
  };
  const originalSaveGroup = saveGroupRecord;
  saveGroupRecord = async function(...args) {
    if (locked) return;
    pendingMedicationSaves++;
    try { return await originalSaveGroup.apply(this, args); }
    finally { pendingMedicationSaves--; if (locked && pendingMedicationSaves === 0) finishIdleSignOut(); }
  };

  for (const eventName of ['pointerdown', 'touchstart', 'keydown', 'input', 'wheel', 'click', 'submit', 'change']) {
    document.addEventListener(eventName, onRealInteraction, { capture: true, passive: false });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (monitoring && !locked) privacyCover();
    } else {
      checkInactivity();
    }
  });
  window.addEventListener('pagehide', () => {
    if (monitoring && !locked) privacyCover();
  });
  window.addEventListener('pageshow', checkInactivity);
  setInterval(checkInactivity, 2500);
})();
init();</script><script defer src="./pwa-register.js"></script></body></html>
